worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 4096; multi_accept on; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # writable temp paths live on tmpfs (container rootfs is read-only)
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  log_format main '$remote_addr "$http_x_forwarded_for" [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
  access_log /dev/stdout main buffer=32k flush=5s;

  server_tokens off;
  sendfile on; tcp_nopush on; tcp_nodelay on;
  keepalive_timeout 30s;
  client_max_body_size 1k;           # static site: no uploads
  client_body_timeout 10s; client_header_timeout 10s; send_timeout 10s;
  large_client_header_buffers 4 8k;
  open_file_cache max=2000 inactive=60s; open_file_cache_valid 120s;

  gzip_static on;                    # precompressed .gz from the build
  gzip on; gzip_vary on; gzip_comp_level 5; gzip_min_length 1024;
  gzip_types application/manifest+json text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

  # Real client IP from the edge proxy (nginx on the private docker network,
  # which itself trusts Cloudflare's CF-Connecting-IP).
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  limit_req_zone $binary_remote_addr zone=perip:10m rate=30r/s;
  limit_req_status 429;

  map $uri $cache_control {
    ~^/_next/static/  "public, max-age=31536000, immutable";
    ~^/brand/         "public, max-age=604800";
    ~\.(ico|png|svg|webmanifest)$ "public, max-age=86400";
    default           "public, max-age=0, must-revalidate";
  }

  server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    limit_req zone=perip burst=60 nodelay;

    include /etc/nginx/security-headers.conf;
    add_header Cache-Control $cache_control always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # only GET/HEAD on a static site
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # hidden files (.git, .env, ...) never served
    location ~ ^/(opengraph|twitter)-image$ { default_type image/png; add_header Cache-Control "public, max-age=86400" always; include /etc/nginx/security-headers.conf; try_files $uri =404; }
    location = /manifest.webmanifest { default_type application/manifest+json; include /etc/nginx/security-headers.conf; add_header Cache-Control "public, max-age=86400" always; }
    location ^~ /.well-known/ { default_type text/plain; try_files $uri =404; }
    location ~ /\. { deny all; return 404; }

    location / {
      index index.html;
      try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; }
  }
}
