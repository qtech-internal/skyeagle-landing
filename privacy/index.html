<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Policy | Sky Eagle</title>
    <meta name="description" content="How Sky Eagle collects, uses, stores and deletes personal data in the Sky Eagle Partner app, the Sky Eagle Customer app and on managed devices." />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/skyeagle-icon.png" />
    <script>
      // Apply a saved theme before first paint; with none saved the system setting decides.
      try {
        var t = localStorage.getItem('se-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/privacy.tsx"></script>
  </body>
</html>
