name: skyeagle-landing

services:
  web:
    build: .
    image: skyeagle-landing:latest
    container_name: skyeagle-landing
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.5
    # Reached only through the edge proxy; localhost port for health checks.
    ports:
      - "127.0.0.1:8081:8080"
    networks: [edge]

networks:
  edge:
    name: edge
    external: true
